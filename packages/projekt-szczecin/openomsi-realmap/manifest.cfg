# openOMSI map package (see MAP_PACKAGE.md in openOMSI's docs), for the map Projekt Szczecin
format    = 1
name      = Projekt Szczecin
# the tile size of the map in metres
grid      = 300
credit    = (c) OpenStreetMap contributors (ODbL) - only the shore and the rivers are real, placed by north and position: not exact

# the map is not aligned with reality: the roads, stops, routes and timetables are the map's own; only the main water (shores, rivers, canals) is real, set by north, scale and position
alignment   = fitted

player      = triangle
# real north lies this many degrees clockwise from the map's own up (the map is turned in the editor)
north       = 172.2
player_free = #ffffff
player_line = #5588c7
player_brt  = #1e7b34

# what the map's rail vehicles are (a part of the vehicle file's path): the map's own AI groups
tram_vehicles = vehicles/konstal_105na/

# the railway stands out from the roads: amber on the dark map, brown on the light one
rail            = #f2b84b
rail_edge       = #2b2208
light_rail      = #8a5a00
light_rail_edge = #fff3d1
