# openOMSI map package (docs/MAP_PACKAGE.md), made by osm_to_package.py
format    = 1
name      = Berlin-Spandau
# the tile size openOMSI lays this map out with, in metres
grid      = 371.934
credit    = (c) OpenStreetMap contributors (ODbL)

player      = triangle
player_free = #ffffff
player_line = #5588c7
player_brt  = #1e7b34
brt_lines   = M32, M36, M37, M45, M49

# what the map's rail vehicles are (a part of the vehicle file's path): the map's own AI groups
metro_vehicles = vehicles/a3/
rail_vehicles = vehicles/bm238/, vehicles/br132/, vehicles/br243/, vehicles/br275/, vehicles/dgbgqe/, vehicles/gueterwagen/, vehicles/ohe/

# the railway stands out from the roads: amber on the dark map, brown on the light one
rail            = #f2b84b
rail_edge       = #2b2208
light_rail      = #8a5a00
light_rail_edge = #fff3d1
