# openOMSI map package (docs/MAP_PACKAGE.md), made by mapgen
format    = 1
name      = Fikcyjny Szczecin
# the tile size of the map in metres
grid      = 300.000
credit    = made from the map's own data


# the railway stands out from the roads: amber on the dark map, brown on the light one
rail            = #f2b84b
rail_edge       = #2b2208
light_rail      = #8a5a00
light_rail_edge = #fff3d1

player      = triangle
# real north lies this many degrees clockwise from the map's own up (the map is turned in the editor)
north       = 0.0
player_free = #ffffff
player_line = #5588c7
player_brt  = #1e7b34

# what the map's rail vehicles are (a part of the vehicle file's path): the map's own AI groups
